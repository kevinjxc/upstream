<!DOCTYPE html>
<html>
    <head>
        <title>Contact | UpSTREAM</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="favicon.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lexend" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300&display=swap" rel="stylesheet">
    </head>

    <body>
        <nav class="navigation">
            <button class="logoButton">
                <a href="https://www.upstreamprogram.org/"><img class="logoImage" src="logoButton.webp" alt="logo"><img></a>
            </button>

            <div class="menu">
                <ul>
                    <li><a class="item" href="./about">About</a></li>
                    <li><a class="item" href="./stream">STREAM</a></li>
                    <li><a class="item" href="./apply">Apply</a></li>
                    <li><a class="item" href="./volunteer">Volunteer</a></li>
                    <li><a class="item" href="./contact">Contact</a></li>
                </ul>
            </div>

            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
        <div class="contactContainer">
            <div class="contactBoxes" onclick="pageEmail()">
                <h5>upstreamprogram@gmail.com</h5>
                <img class="contactImage" src="email.webp" alt="email"><img>
            </div>

            <div class="contactBoxes" onclick="pagePhone()">
                <h5>+1 (206) 486-4950</h5>
                <img class="contactImage" src="phone.webp" alt="phone"><img>
            </div>

            <div class="contactBoxes" onclick="pageLocation()">
                <h5>Seattle, Washington</h5>
                <img class="contactImage" src="location.webp" alt="location"><img>
            </div>
        </div>

        <iframe class="contactForm" src="https://docs.google.com/forms/d/e/1FAIpQLSdRsHVOvWRkGRQkjoefkUhYKu3M5XaXn4tVfB7_RHJ4z4SrGA/viewform?embedded=true" frameborder="0">Loading…</iframe>
        
        <div class="footer">
            <img class="footerImage" src="logo.webp" alt="logo" onclick="pageIndex()"><img>
            <h4 style="color: #355BF2;">© <span class="current-year"></span> UpSTREAM Program</h4>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
